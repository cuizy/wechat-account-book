name: Upload to WeChat

on:
  push:
    branches:
      - master

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Upload to WeChat
        run: node ci.js
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY_CONTENT: ${{ secrets.WECHAT_PRIVATE_KEY }}
          WECHAT_VERSION: ${{ github.run_number }}
          CI: true
          OPENSSL_ENABLE_LEGACY_PROVIDER: true
          NODE_OPTIONS: --openssl-legacy-provider
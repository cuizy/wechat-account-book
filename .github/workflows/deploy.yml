name: Upload to WeChat

on:
  push:
    branches:
      - master

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Write private key (PKCS#8 for OpenSSL 3.x)
        run: |
          mkdir -p .keys
          echo "$WECHAT_PRIVATE_KEY" > .keys/wechat-private-pkcs1.pem
          openssl pkcs8 -topk8 -nocrypt -in .keys/wechat-private-pkcs1.pem -out .keys/wechat-private.pem
          chmod 600 .keys/wechat-private.pem

      - name: Upload to WeChat
        run: node ci.js
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY_PATH: ${{ github.workspace }}/.keys/wechat-private.pem
          WECHAT_VERSION: ${{ github.run_number }}
          CI: true
          # Try legacy provider for OpenSSL 3.x
          OPENSSL_ENABLE_LEGACY_PROVIDER: true
          NODE_OPTIONS: --openssl-legacy-provider
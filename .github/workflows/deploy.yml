name: Upload to WeChat

on:
  push:
    branches:
      - master

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Write private key
        run: |
          mkdir -p .keys
          echo "$WECHAT_PRIVATE_KEY" > .keys/wechat-private.pem
          chmod 600 .keys/wechat-private.pem

      - name: Upload to WeChat
        run: node ci.js
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY_PATH: ${{ github.workspace }}/.keys/wechat-private.pem
          CI: true